# Marketing Site (returnshield.app)
server {
    server_name returnshield.app www.returnshield.app;
    root /opt/ReturnShield/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Shopper Portal (returnshield.app/return)
    location /return {
        alias /opt/ReturnShield/apps/shopper-frontend/dist;
        try_files $uri $uri/ /return/index.html;
    }

    # Backend API
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin
    location /admin {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Static (for admin)
    location /static/django {
        alias /opt/ReturnShield/backend/staticfiles;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/returnshield.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/returnshield.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Dashboard (app.returnshield.app)
server {
    server_name app.returnshield.app;
    root /opt/ReturnShield/app-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API for Dashboard
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/app.returnshield.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.returnshield.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Analytics (analytics.returnshield.app)
server {
    server_name analytics.returnshield.app;

    location / {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/analytics.returnshield.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.returnshield.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP Redirects
server {
    if ($host = www.returnshield.app) { return 301 https://$host$request_uri; }
    if ($host = returnshield.app) { return 301 https://$host$request_uri; }
    listen 80;
    server_name returnshield.app www.returnshield.app;
    return 404;
}

server {
    if ($host = app.returnshield.app) { return 301 https://$host$request_uri; }
    listen 80;
    server_name app.returnshield.app;
    return 404;
}

server {
    if ($host = analytics.returnshield.app) { return 301 https://$host$request_uri; }
    listen 80;
    server_name analytics.returnshield.app;
    return 404;
}
